name: Build and release

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (e.g. v5.36.0)"
        required: false

env:
  UPSTREAM: TwiN/gatus

jobs:
  detect:
    name: Detect latest version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Resolve upstream tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved upstream tag: $TAG"
      - name: Decide whether to build
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.resolve.outputs.tag }}" \
              -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.resolve.outputs.tag }} already exists, skipping build."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-release:
    name: Build release
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.detect.outputs.tag }}
    steps:
      - name: Checkout upstream at tag
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ env.TAG }}
          path: gatus-src

