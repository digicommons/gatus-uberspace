name: Build and release

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (e.g. v5.36.0)"
        required: false

env:
  UPSTREAM: TwiN/gatus

jobs:
  detect:
    name: Detect latest version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Resolve upstream tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved upstream tag: $TAG"
      - name: Decide whether to build
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.resolve.outputs.tag }}" \
              -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.resolve.outputs.tag }} already exists, skipping build."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-release:
    name: Build release
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # needed for attesting build provenance
      attestations: write   # needed for attesting build provenance
    env:
      TAG: ${{ needs.detect.outputs.tag }}
    steps:
      - name: Checkout upstream at tag
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ env.TAG }}
          path: gatus-src
      - name: Set up Go (version pinned by upstream go.mod)
        uses: actions/setup-go@v6
        with:
          go-version-file: gatus-src/go.mod
      - name: Build static linux/amd64 binary
        working-directory: gatus-src
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags "-s -w" -o gatus .
          file gatus
          file gatus | grep -q "statically linked"  # Was compiled properly into a statically linked binary
      - name: Package binary, LICENSE and checksum
        working-directory: gatus-src
        run: |
          ARTIFACT="gatus_${TAG}_linux_amd64.tar.gz"
          tar -czf "$ARTIFACT" gatus LICENSE
          sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: gatus-src/gatus_${{ env.TAG }}_linux_amd64.tar.gz
      - name: Create release
        working-directory: gatus-src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT="gatus_${TAG}_linux_amd64.tar.gz"
          gh release create "$TAG" \
            -R "$GITHUB_REPOSITORY" \
            --title "${TAG}" \
            --notes "Unofficial, statically-linked \`linux/amd64\` build of upstream [TwiN/gatus](https://github.com/TwiN/gatus) at tag \`${TAG}\`, packaged for deployment on [Uberspace](https://uberspace.de).
 
          Built from unmodified upstream source with \`CGO_ENABLED=0 go build\`.
          
          Not affiliated with nor endorsed by the Gatus project or TwiN.

          **Upstream release notes:** https://github.com/TwiN/gatus/releases/tag/${TAG}

          Verify checksum: \`sha256sum -c ${ARTIFACT}.sha256\`" \
            "$ARTIFACT" "$ARTIFACT.sha256"


